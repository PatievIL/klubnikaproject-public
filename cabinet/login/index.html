<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Вход — Klubnika Project</title>
  <link rel="canonical" href="https://klubnikaproject.ru/login/" />
  <meta http-equiv="refresh" content="0; url=../../login/?next=/cabinet/" />
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || params.get("redirecturl") || "/cabinet/";
      const target = new URL("../../login/", window.location.href);
      target.searchParams.set("next", next);
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p><a href="../../login/?next=/cabinet/">Открыть вход</a></p>
</body>
</html>
