<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <link rel="manifest" href="../../site.webmanifest" />
  <title>Вход в кабинет KLUBNIKA PROJECT</title>
  <meta
    name="description"
    content="Вход в кабинет KLUBNIKA PROJECT для проекта, заказов, документов, сообщений и обучения."
  />
  <link rel="stylesheet" href="../../styles.css?v=20260512-hero-label" />
  <link rel="stylesheet" href="../../account/account.css?v=20260402b" />
  <link rel="stylesheet" href="../cabinet.css?v=20260512-auth-popup" />
  <link rel="stylesheet" href="../../assets/css/kp-header.css?v=20260512-cabinet-entry" />
  <!-- SEO:START -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://klubnikaproject.ru/cabinet/login/" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "@id": "https://klubnikaproject.ru/cabinet/login/#webpage",
    "url": "https://klubnikaproject.ru/cabinet/login/",
    "name": "Вход в кабинет",
    "description": "Вход в кабинет KLUBNIKA PROJECT для проекта, заказов, документов, сообщений и обучения.",
    "inLanguage": "ru-RU",
    "isPartOf": {
      "@id": "https://klubnikaproject.ru/#website"
    }
  }
  </script>
  <!-- SEO:END -->
</head>
<body data-cabinet-view="login" data-cabinet-account="member" data-header-theme="light">
  <header class="kp-site-header" data-kp-header data-root="../../"></header>
  <script src="../../assets/js/kp-header.js?v=20260512-cabinet-entry"></script>
  <main>
    <section class="cabinet-auth-screen" aria-labelledby="cabinet-auth-title">
      <div class="cabinet-auth-modal" role="dialog" aria-modal="true" aria-labelledby="cabinet-auth-title">
        <div class="cabinet-auth-head">
          <span class="cabinet-kicker">Кабинет</span>
          <h1 class="hero-title-compact" id="cabinet-auth-title">Вход в кабинет</h1>
          <p class="sublead">Войдите в рабочую зону проекта или зарегистрируйтесь, чтобы сохранить покупку, расчёт и переписку.</p>
        </div>

        <div class="cabinet-auth-tabs" role="tablist" aria-label="Доступ в кабинет">
          <button class="cabinet-auth-tab is-active" type="button" role="tab" aria-selected="true" data-cabinet-auth-tab="login">Вход</button>
          <button class="cabinet-auth-tab" type="button" role="tab" aria-selected="false" data-cabinet-auth-tab="register">Регистрация</button>
        </div>

        <form class="account-form cabinet-auth-form is-active" id="cabinet-login-form" data-cabinet-auth-panel="login">
          <label class="account-label">
            <span>Логин или email</span>
            <input class="account-input" id="cabinet-login-identity" type="text" autocomplete="username" placeholder="Например, ваш email" />
          </label>
          <label class="account-label">
            <span>Пароль</span>
            <input class="account-input" id="cabinet-login-password" type="password" autocomplete="current-password" placeholder="Введите пароль" />
          </label>
          <div class="account-actions cabinet-auth-actions">
            <button class="btn btn-primary" type="submit">Открыть кабинет</button>
          </div>
        </form>

        <form class="account-form cabinet-auth-form" id="cabinet-register-form" data-cabinet-auth-panel="register" hidden>
          <label class="account-label">
            <span>Имя</span>
            <input class="account-input" id="cabinet-register-name" type="text" autocomplete="name" placeholder="Как к вам обращаться" />
          </label>
          <label class="account-label">
            <span>Email</span>
            <input class="account-input" id="cabinet-register-email" type="email" autocomplete="email" placeholder="email@example.com" />
          </label>
          <label class="account-label">
            <span>Пароль</span>
            <input class="account-input" id="cabinet-register-password" type="password" autocomplete="new-password" placeholder="Минимум 8 символов" />
          </label>
          <div class="account-actions cabinet-auth-actions">
            <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
          </div>
          <p class="cabinet-auth-legal">
            Регистрируясь, вы соглашаетесь с <a href="../../docs/policy/">политикой обработки данных</a>.
          </p>
        </form>

        <div class="account-status" id="cabinet-login-status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="../cabinet.js?v=20260512-auth-popup" type="module"></script>
</body>
</html>
